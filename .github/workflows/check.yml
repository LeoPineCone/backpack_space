name: check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # Own step, so a new advisory does not hide a code failure (QA-08). Only what ships in the app or the
      # backend counts; dev-tool findings are listed in docs/testing.md.
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high
      # Same script as locally, so local and CI never differ.
      - name: Check (validate, typecheck, lint, test)
        run: npm run check

  # Level 4 in the browser engines (docs/testing.md): own job, so a failure says which level broke.
  # Runs in Playwright's own image: browsers and their system libraries are already inside, so no apt install and
  # no browser download (that step sometimes hung for 10-20 minutes). The tag must match the Playwright version
  # in package-lock.json; test/ci.test.ts checks that.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    # the browser runs play against the local backend; its database runs beside the job (same image as `npm run db`)
    services:
      dynamodb:
        image: amazon/dynamodb-local:3.3.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Reference fights in Chromium and WebKit
        run: npm run test:e2e
      - name: Browser runs against the local backend in Chromium and WebKit
        run: npm run test:e2e:runs -- --project webkit --repeat-each 4 -g "end of a run"
        env:
          TEST_DB_ENDPOINT: http://dynamodb:8000

  # Level 2 (docs/testing.md): interface tests over HTTP against the local backend and DynamoDB Local (Docker).
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Interface tests
        run: npm run test:api
