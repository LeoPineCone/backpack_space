<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backpack Space lore</title>
<style>
:root{--bg:#12162a;--panel:#1a2038;--ink:#0b0d14;--text:#e6dcc3;--muted:#9a937f;--place:#c9962e;--hero:#a63d2a;--item:#1f8a8f;--line:#3a4466}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,sans-serif}
header{padding:12px 16px 4px}h1{font-size:18px;margin:0}header p{margin:2px 0 0;color:var(--muted);font-size:13px}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:6px 16px;font-size:13px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
main{display:flex;flex-wrap:wrap;gap:12px;padding:0 16px 16px}
#wrap{flex:1 1 560px;min-width:0;background:var(--ink);border-radius:10px;overflow:auto}
svg{display:block;width:100%;height:auto}@media (max-width:700px){svg{min-width:760px}}
#info{flex:1 1 280px;background:var(--panel);border-radius:10px;padding:14px 16px;align-self:flex-start}
#info h2{margin:0;font-size:17px}#info .sub{color:var(--muted);font-size:13px;margin-bottom:8px}#info p{margin:6px 0}
#info ul{margin:8px 0 0;padding-left:18px}#info li{cursor:pointer;color:var(--place)}
.n text{fill:var(--text);font-size:12px;paint-order:stroke;stroke:var(--ink);stroke-width:3px;user-select:none}
.n{cursor:pointer;touch-action:none}.dim{opacity:.18}line{stroke:var(--line);stroke-width:1.5}line.hl{stroke:var(--text)}
</style></head><body>
<header><h1>Backpack Space – places and what comes from them</h1><p>Generated from lore/planets.json by npm run lore. Tap a node or its name; drag to move it. On a phone, swipe the graph sideways.</p></header>
<div class="legend"><span><i style="background:var(--place)"></i>place</span><span><i style="background:var(--hero)"></i>hero</span><span><i style="background:var(--item)"></i>item</span></div>
<main><div id="wrap"><svg id="g" viewBox="0 0 900 700"></svg></div><aside id="info"><h2>Tap a node</h2><div class="sub">Places are drafts until decided.</div></aside></main>
<script>
const D={"nodes":[{"id":"place:rime","label":"Rime","group":"place","sub":"planet · draft","lines":["Traits: frozen night planet; a sun too far away to warm it; frozen methane seas; long darkness.","Life: Large slow animals with ice grown into their coats, wide flat feet for the frozen seas, big pale eyes for the dark.","Background idea: A flat sea of cracked blue-black methane ice under a tiny pale sun; frost ridges, a herd silhouette far away."]},{"id":"item:tundra_yak","label":"Tundra Yak","group":"item","sub":"pet, beast, weapon, organic · rare","lines":["Yak from a frozen night planet, ice-spiked coat, snowshoe hooves. Accent: bone.","Picture: Filling the square box: a huge yak from a frozen night planet. Its shaggy coat is stiff with blue ice spikes, its hooves are wide and flat like snowshoes for walking on frozen methane seas, and big pale eyes for the long darkness. Short heavy horns, a dented copper bell on a rope."]},{"id":"item:ice_ferret","label":"Ice Ferret","group":"item","sub":"pet, weapon, organic · rare","lines":["Ferret with frosty white fur and icy whiskers. Accent: deep teal.","Picture: Lying across the box: a long, slinky ferret with frosty white fur and icicle whiskers, tail curled."]},{"id":"item:frost_gem","label":"Frost Gem","group":"item","sub":"accessory · common","lines":["Six-sided gem of methane ice with a crown of frost spikes. Accent: deep teal.","Picture: A six-sided teal gem cut from the methane ice of a frozen night planet, frozen bubbles inside, frost spikes growing from its top like a crown."]},{"id":"item:cryo_coat","label":"Cryo Coat","group":"item","sub":"armor · rare","lines":["Long padded coat with frost on the shoulders. Accent: deep teal.","Picture: Upright: a long quilted coat with a high collar, frost crusted on the shoulders and hem, icicles hanging from the cuffs."]},{"id":"place:cinder","label":"Cinder","group":"place","sub":"planet · draft","lines":["Traits: lava world; black basalt plains; rivers of slow lava; steam vents.","Life: Animals with cracked basalt skin and rust-red heat in the cracks; food that is spicy enough to smoke.","Background idea: Black basalt plates split by rust-red lava rivers, steam drawn as wavy ink lines, a dark red sky."]},{"id":"item:magma_newt","label":"Magma Newt","group":"item","sub":"pet, organic · rare","lines":["Newt from a lava planet with basalt skin. Accent: rust red.","Picture: A newt from a lava planet lying across the box, its skin cracked like cooling black basalt with rust-red heat in the cracks as flat colour, its tail ending in a lump of volcanic glass, steam as wavy ink lines."]},{"id":"item:magma_curry","label":"Magma Curry","group":"item","sub":"food, organic · epic","lines":["Bowl of curry bubbling like lava. Accent: rust red.","Picture: Lying across the box: a bowl of curry bubbling like lava, black crust cracking over rust-red sauce, a spoon in it."]},{"id":"item:rocket_chili","label":"Rocket Chili","group":"item","sub":"food, organic · rare","lines":["Lava-planet chili with basalt skin and rocket fins. Accent: rust red.","Picture: A chili from a lava planet: cracked black basalt skin with rust-red heat in the cracks as flat colour, stubby rocket fins at the stem."]},{"id":"place:the_drift","label":"The Drift","group":"place","sub":"comet · draft","lines":["Traits: a cloud of icy comets; almost no gravity; trails of frozen dust.","Life: Light, long-legged animals that leap from comet to comet, trailing dust like comet tails.","Background idea: Tumbling comets of dirty ice with long dust tails across a dark sky."]},{"id":"item:comet_fox","label":"Comet Fox","group":"item","sub":"pet, weapon, organic · rare","lines":["Long-legged fox from an icy comet, tail like a comet tail. Accent: rust red.","Picture: A lean fox from a small icy comet, long thin legs for low gravity, mid-leap across the box. Its tail streams behind it as a long trail of frozen dust like a comet tail. Big ears like tiny antenna dishes."]},{"id":"item:comet_sorbet","label":"Comet Sorbet","group":"item","sub":"food · rare","lines":["Scoop of comet ice in a dented ration cup, frozen dust tail. Accent: deep teal.","Picture: A scoop of dirty comet ice in a dented ration cup, a long tail of frozen dust streaming off it as if still flying, a spoon on a tether cord."]},{"id":"place:ochre","label":"Ochre","group":"place","sub":"planet · draft","lines":["Traits: heavy-gravity desert; layered red sandstone; everything is squat and flat.","Life: Flat, armoured animals with short thick legs; shells and armour of layered sandstone.","Background idea: Low red sandstone mesas in flat layers under a heavy brown sky; nothing stands tall."]},{"id":"item:rock_crab","label":"Rock Crab","group":"item","sub":"pet, armor, organic · common","lines":["Squat crab from a heavy desert planet, sandstone shell, crystal claw. Accent: copper.","Picture: A squat flat crab from a heavy-gravity desert planet, its shell a slab of layered red sandstone, short thick legs, one oversized claw of rough pale crystal."]},{"id":"item:rock_shell","label":"Rock Shell","group":"item","sub":"armor · common","lines":["Shell made of fused asteroid rock, rough and lumpy. Accent: copper.","Picture: Lying across the box: a domed shell of fused grey asteroid rock, lumpy, with a few sharp edges where a blow could bounce back."]},{"id":"place:thinwind","label":"Thinwind","group":"place","sub":"planet · draft","lines":["Traits: dry desert with very thin air; ore pebbles everywhere; constant dust wind.","Life: Small round burrowers with frilly breathing gills that hoard shiny ore pebbles.","Background idea: Pale dunes full of glinting ore pebbles, burrow holes, a dusty mustard sky."]},{"id":"item:space_hamster","label":"Space Hamster","group":"item","sub":"pet, swarm, weapon, organic · common","lines":["Hamster from a desert planet, cheeks full of ore pebbles. Accent: mustard.","Picture: A round hamster from a thin-air desert planet, cheeks stuffed with shiny ore pebbles, frilly breathing gills on its neck, small room around it. Mustard fur."]},{"id":"item:dust_bunny","label":"Dust Bunny","group":"item","sub":"pet, swarm, organic · common","lines":["Rolling ball of grey fluff from a windy desert, tiny dust devil below. Accent: bone.","Picture: A round ball of grey fluff from a windy desert planet, rolling like a tumbleweed, two long ears, two dot eyes, a tiny dust devil spinning under it."]},{"id":"place:gemell","label":"Gemell","group":"place","sub":"planet · draft","lines":["Traits: two moons in its sky; long twilight; pale forests.","Life: Night insects whose markings repeat the two moons.","Background idea: A pale twilight forest under two crescent moons, moths drifting between the trees."]},{"id":"item:moon_moth","label":"Moon Moth","group":"item","sub":"pet, swarm, organic · common","lines":["Moth from a planet with two moons. Accent: bone.","Picture: A pale moth from a planet with two moons, each wing marked with two dark crescents, feathery antennae, fuzzy body, wings spread wide."]},{"id":"item:lunar_moth","label":"Lunar Moth","group":"item","sub":"pet, swarm, organic · rare","lines":["Tiny pale moth with moon crescents on its wings, two smaller moths behind it. Accent: bone.","Picture: A tiny pale moth with moon crescents on its wings, two even smaller moths fluttering behind it, dust falling as flat bone specks."]},{"id":"place:pell","label":"Pell","group":"place","sub":"moon · draft","lines":["Traits: small cratered moon; crumbly pale crust; a ring of drifting crumbs.","Life: Station cooks claim its craters ripen the best moon cheese.","Background idea: A pocked pale moon, close enough to see every crater, with a few crumbs in orbit."]},{"id":"item:moon_cheese","label":"Moon Cheese","group":"item","sub":"food, organic · common","lines":["Cheese wheel shaped like a cratered mini moon, a crumb orbiting it. Accent: mustard.","Picture: A small cheese wheel shaped like a cratered mini moon, one wedge cut out showing the pale inside, a single crumb orbiting it like a tiny moon. Mustard rind."]},{"id":"place:scrap_belt","label":"The Scrap Belt","group":"place","sub":"belt · draft","lines":["Traits: asteroid belt full of wrecks; mining claims; drifting ship parts.","Life: Miners, salvage robots and burrowing animals that live inside asteroids.","Background idea: Asteroids and broken hulls tumbling together, a mining tether between two rocks."]},{"id":"hero:rook","label":"RK-7 \"Rook\"","group":"hero","sub":"Salvage Unit","lines":[]},{"id":"item:mining_pick","label":"Mining Pick","group":"item","sub":"weapon · common","lines":["Asteroid mining pick with a crystal tip. Accent: copper.","Picture: The pick head runs along the top two cells, the handle drops down the left cell; the empty corner stays free. Meteor-iron head with a teal crystal tip and a small thruster on its back, taped grip, tether clip."]},{"id":"item:asteroid_chunk","label":"Asteroid Chunk","group":"item","sub":"weapon · common","lines":["Lumpy asteroid rock to throw. Accent: copper.","Picture: A fist-sized lump of grey-brown space rock with a few hard facets and pocks, small enough to throw. One shape, heavy black shadow underneath."]},{"id":"item:asteroid_mole","label":"Asteroid Mole","group":"item","sub":"pet, organic · common","lines":["Mole with big digging claws and goggles. Accent: copper.","Picture: Upright: a stubby mole standing on its hind legs, huge digging claws in front, cracked goggles pushed up on its head."]},{"id":"item:scrap_metal","label":"Scrap Metal","group":"item","sub":"accessory, mechanical · common","lines":["Bent metal plate with rivets and a torn edge. Accent: copper.","Picture: A bent square of metal plate with three rivets and one torn edge, copper patina in the corners."]},{"id":"place:garden_station","label":"The Garden Station","group":"place","sub":"station · draft","lines":["Traits: research station that bred crops for open vacuum; overgrown by the failed experiment.","Life: Venn and everything that grew from it; the botanist's old drone.","Background idea: A station ring split open, rust-red tendrils growing out of the windows into space."]},{"id":"hero:venn","label":"Venn","group":"hero","sub":"The Thing in the Suit","lines":[]},{"id":"item:seed_pod","label":"Seed Pod","group":"item","sub":"weapon, organic · common · Venn","lines":["Hard seed pod with a split seam spitting seeds, a paper specimen tag tied to its stem. Accent: moss.","Picture: A hard seed pod split along one seam, spitting small seeds, a paper specimen tag from Venn's lab tied to its stem."]},{"id":"item:watering_drone","label":"Watering Drone","group":"item","sub":"pet, mechanical · common · Venn","lines":["Small dented drone with a watering-can spout and a faded stencil patch, a vine wound round one leg. Accent: deep teal.","Picture: Venn's botanist's old drone, still following the suit: round, dented, spout forward, one vine wound round its single leg. The stencil is a faded patch, no letters."]},{"id":"place:herdworld","label":"Herdworld","group":"place","sub":"planet · draft","lines":["Traits: wide grass plains; wild herds of space beasts; where Quill's escape pod came down.","Life: Huge shaggy tusked beasts and the smaller animals that ride in their fur.","Background idea: Rolling plains with a dented escape pod half sunk in the grass and a herd on the horizon."]},{"id":"hero:quill","label":"Quill","group":"hero","sub":"Foundling of the Herd","lines":[]},{"id":"item:tusked_behemoth","label":"Tusked Behemoth","group":"item","sub":"pet, beast, weapon, organic · epic · Quill","lines":["Huge shaggy beast with four tusks, low and heavy, a small woven nest between its horns. Accent: copper.","Picture: Quill's mount, the same beast as in the hero design. A huge, low, shaggy body filling the box sideways, head to one side with four curved tusks under a heavy brow and tiny eyes. Between its horns an empty woven nest (Quill herself is not in the picture). Matted fur in heavy clumps, two small animals clinging to its flank."]},{"id":"item:dune_ox","label":"Dune Ox","group":"item","sub":"pet, beast, weapon, organic · common","lines":["Shaggy ox with wide curved horns and sand caked on its coat, head lowered. Accent: mustard.","Picture: Filling the square box: a big shaggy ox with wide curved horns, head lowered, sand caked on its long coat, a short breath cloud at its nostrils, one front hoof scraping the ground."]},{"id":"place:corona","label":"The Dying Corona","group":"place","sub":"star · draft","lines":["Traits: a red star close to its end; Ysel's order keeps it company; breaking into fragments; the planet Vigil circles it.","Life: Pilgrims of the order; cracked sun pieces carried as relics.","Background idea: A huge cracked red-and-mustard star filling the sky, broken pieces circling it, heat as wavy ink lines."]},{"id":"item:sun_shard","label":"Sun Shard","group":"item","sub":"weapon · common · Ysel","lines":["Broken piece of a dying sun, cracked flat mustard and rust, wavy heat lines. Accent: mustard.","Picture: A broken piece of a dying sun, cracked flat mustard and rust, wavy heat lines rising, no glow."]},{"id":"place:vigil","label":"Vigil","group":"place","sub":"planet · draft","lines":["Traits: red desert planet close to the Dying Corona; the dying star hangs huge and low in its sky; ruins of the solar moths' monastery.","Life: Solar moths of Ysel's order, who fly to dying stars and stay until the end; dry grass on red sand.","Background idea: Red sandy desert with mesas under a coral and mustard evening sky, the huge cracked red star low on the horizon, old stone pillars carved with sun and moon phases."]},{"id":"hero:ysel","label":"Ysel","group":"hero","sub":"Moth of the Last Light","lines":[]}],"links":[["place:rime","item:tundra_yak","origin of"],["place:rime","item:ice_ferret","origin of"],["place:rime","item:frost_gem","origin of"],["place:rime","item:cryo_coat","origin of"],["place:cinder","item:magma_newt","origin of"],["place:cinder","item:magma_curry","origin of"],["place:cinder","item:rocket_chili","origin of"],["place:the_drift","item:comet_fox","origin of"],["place:the_drift","item:comet_sorbet","origin of"],["place:ochre","item:rock_crab","origin of"],["place:ochre","item:rock_shell","origin of"],["place:thinwind","item:space_hamster","origin of"],["place:thinwind","item:dust_bunny","origin of"],["place:gemell","item:moon_moth","origin of"],["place:gemell","item:lunar_moth","origin of"],["place:pell","place:gemell","orbits"],["place:pell","item:moon_cheese","origin of"],["place:scrap_belt","hero:rook","home of"],["place:scrap_belt","item:mining_pick","origin of"],["place:scrap_belt","item:asteroid_chunk","origin of"],["place:scrap_belt","item:asteroid_mole","origin of"],["place:scrap_belt","item:scrap_metal","origin of"],["place:garden_station","hero:venn","home of"],["place:garden_station","item:seed_pod","origin of"],["item:seed_pod","hero:venn","hero item"],["place:garden_station","item:watering_drone","origin of"],["item:watering_drone","hero:venn","hero item"],["place:herdworld","hero:quill","home of"],["place:herdworld","item:tusked_behemoth","origin of"],["item:tusked_behemoth","hero:quill","hero item"],["place:herdworld","item:dune_ox","origin of"],["place:corona","item:sun_shard","origin of"],["place:vigil","hero:ysel","home of"],["item:sun_shard","hero:ysel","hero item"]]};
const W=900,H=700,R={place:16,hero:12,item:8};
const N=D.nodes.map((n,i)=>({...n,x:W/2+Math.cos(i*2.4)*(60+i*6),y:H/2+Math.sin(i*2.4)*(60+i*6),vx:0,vy:0}));
const byId=Object.fromEntries(N.map(n=>[n.id,n]));const L=D.links.map(([a,b,t])=>({a:byId[a],b:byId[b],t}));
function step(k){for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){const a=N[i],b=N[j];let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy||1;const f=Math.min(2200/d2,4)*k,d=Math.sqrt(d2);dx/=d;dy/=d;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f}
for(const l of L){const dx=l.b.x-l.a.x,dy=l.b.y-l.a.y,d=Math.hypot(dx,dy)||1,want=l.t==="orbits"?70:l.a.group==="place"&&l.b.group==="hero"?80:60,f=(d-want)*0.03*k;l.a.vx+=dx/d*f;l.a.vy+=dy/d*f;l.b.vx-=dx/d*f;l.b.vy-=dy/d*f}
for(const n of N){n.vx+=(W/2-n.x)*0.002*k;n.vy+=(H/2-n.y)*0.002*k;if(n.fixed){n.vx=n.vy=0;continue}n.x+=n.vx;n.y+=n.vy;n.vx*=0.6;n.vy*=0.6;n.x=Math.max(30,Math.min(W-130,n.x));n.y=Math.max(20,Math.min(H-20,n.y))}}
for(let i=0;i<500;i++)step(1);
const svg=document.getElementById("g"),NS="http://www.w3.org/2000/svg";
const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e};
const lines=L.map(l=>{const e=el("line",{});svg.appendChild(e);return e});
const col={place:"var(--place)",hero:"var(--hero)",item:"var(--item)"};
const gs=N.map(n=>{const g=el("g",{class:"n"});g.appendChild(el("circle",{r:R[n.group],fill:col[n.group],stroke:"#0b0d14","stroke-width":2}));const t=el("text",{x:R[n.group]+4,y:4});t.textContent=n.label;g.appendChild(t);svg.appendChild(g);return g});
function draw(){L.forEach((l,i)=>{lines[i].setAttribute("x1",l.a.x);lines[i].setAttribute("y1",l.a.y);lines[i].setAttribute("x2",l.b.x);lines[i].setAttribute("y2",l.b.y)});N.forEach((n,i)=>gs[i].setAttribute("transform","translate("+n.x+","+n.y+")"))}
draw();
const info=document.getElementById("info");
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"})[c])}
function select(n){const nb=new Set([n.id]);L.forEach((l,i)=>{const on=l.a===n||l.b===n;lines[i].classList.toggle("hl",on);if(on){nb.add(l.a.id);nb.add(l.b.id)}});
N.forEach((m,i)=>gs[i].classList.toggle("dim",!nb.has(m.id)));
const rel=L.filter(l=>l.a===n||l.b===n).map(l=>{const o=l.a===n?l.b:l.a;return '<li data-id="'+o.id+'">'+esc(o.label)+' <span style="color:var(--muted)">('+esc(l.a===n?l.t:{"origin of":"comes from","home of":"lives at","orbits":"orbited by","hero item":"item of"}[l.t])+')</span></li>'}).join("");
info.innerHTML="<h2>"+esc(n.label)+'</h2><div class="sub">'+esc(n.group+" · "+n.sub)+"</div>"+n.lines.map(s=>"<p>"+esc(s)+"</p>").join("")+(rel?"<ul>"+rel+"</ul>":"");
info.querySelectorAll("li").forEach(li=>li.onclick=()=>select(byId[li.dataset.id]))}
let drag=null,moved=false,start=null;
function pt(e){const r=svg.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
gs.forEach((g,i)=>g.addEventListener("pointerdown",e=>{drag=N[i];moved=false;start=pt(e);drag.fixed=true;g.setPointerCapture(e.pointerId)}));
svg.addEventListener("pointermove",e=>{if(!drag)return;const p=pt(e);if(!moved&&Math.hypot(p.x-start.x,p.y-start.y)<6)return;drag.x=p.x;drag.y=p.y;moved=true;for(let i=0;i<3;i++)step(0.3);draw()});
const up=()=>{if(drag&&!moved)select(drag);if(drag)drag.fixed=false;drag=null};gs.forEach(g=>g.addEventListener("pointerup",up));svg.addEventListener("pointerup",up);
</script></body></html>
