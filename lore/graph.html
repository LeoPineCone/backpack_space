<style>
:root{--bg:#12162a;--panel:#1a2038;--ink:#0b0d14;--text:#e6dcc3;--muted:#9a937f;--place:#c9962e;--hero:#a63d2a;--item:#1f8a8f;--line:#3a4466}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,sans-serif}
header{padding:12px 16px 4px}h1{font-size:18px;margin:0}header p{margin:2px 0 0;color:var(--muted);font-size:13px}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:6px 16px;font-size:13px;color:var(--muted)}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
main{display:flex;flex-wrap:wrap;gap:12px;padding:0 16px 16px}
#wrap{flex:1 1 560px;min-width:0;background:var(--ink);border-radius:10px;overflow:auto}
svg{display:block;width:100%;height:auto}@media (max-width:700px){svg{min-width:760px}}

#info h2{margin:0;font-size:17px}#info .sub{color:var(--muted);font-size:13px;margin-bottom:8px}#info p{margin:6px 0}
#info ul{margin:8px 0 0;padding-left:18px}#info li{cursor:pointer;color:var(--place)}
.n text{fill:var(--text);font-size:12px;paint-order:stroke;stroke:var(--ink);stroke-width:3px;user-select:none}
.n{cursor:pointer;touch-action:none}.dim{opacity:.18}line{stroke:var(--line);stroke-width:1.5}line.hl{stroke:var(--text)}
</style></head><body>
<header><h1>Backpack Space – places and what comes from them</h1><p>Generated from lore/planets.json by npm run lore. Tap a node or its name; drag to move it. On a phone, swipe the graph sideways.</p></header>
<div class="legend"><span><i style="background:var(--place)"></i>place</span><span><i style="background:var(--hero)"></i>hero</span><span><i style="background:var(--item)"></i>item</span></div>
<main><div id="wrap"><svg id="g" viewBox="0 0 900 700"></svg></div><aside id="info"><h2>Tap a node</h2><div class="sub">Places are drafts until decided.</div></aside></main>
<script>
const D={"nodes":[{"id":"place:rime","label":"Rime","group":"place","sub":"planet · draft","lines":["Traits: frozen night planet; a sun too far away to warm it; frozen methane seas; long darkness.","Life: Large slow animals with ice grown into their coats, wide flat feet for the frozen seas, big pale eyes for the dark.","Background idea: A flat sea of cracked blue-black methane ice under a tiny pale sun; frost ridges, a herd silhouette far away."]},{"id":"item:tundra_yak","label":"Tundra Yak","group":"item","sub":"pet, beast, weapon, organic · rare","lines":["Ice-spiked yak with snowshoe hooves and big pale eyes. Accent: teal.","Picture: Filling the square box: a huge yak from a frozen night planet. Its shaggy coat is stiff with blue ice spikes, its hooves are wide and flat like snowshoes for walking on frozen methane seas, and big pale eyes for the long darkness. Short heavy horns, a dented copper bell on a rope."]},{"id":"item:ice_ferret","label":"Ice Ferret","group":"item","sub":"pet, weapon, organic · rare","lines":["Slinky Rime ferret with an ice-crystal crest along its spine. Accent: teal.","Picture: Lying across the box: a long slinky ferret from Rime, white fur, a crest of clear teal ice crystals along its spine, big pale eyes, its tail curled round a chunk of methane ice."]},{"id":"item:frost_gem","label":"Frost Gem","group":"item","sub":"accessory · common","lines":["Six-sided gem of Rime methane ice with a frost crown. Accent: teal.","Picture: A six-sided teal gem cut from the methane ice of a frozen night planet, frozen bubbles inside, frost spikes growing from its top like a crown."]},{"id":"item:cryo_coat","label":"Cryo Coat","group":"item","sub":"armor · rare","lines":["Long coat of ice-spiked Rime fur with snowshoe flaps. Accent: teal.","Picture: Upright: a long coat sewn from the shaggy fur of a Rime yak, stiff teal ice spikes along the shoulders, wide snowshoe flaps at the hem, icicles hanging from the cuffs."]},{"id":"item:cryo_sprayer","label":"Cryo Sprayer","group":"item","sub":"weapon, mechanical · rare","lines":["Spray gun with a tank of Rime methane ice, hexagon frost spray. Accent: teal.","Picture: Lying across the box: a spray gun with a round tank of frozen methane from the night planet Rime on top, frost crust on the nozzle, a spray of flat teal hexagon ice crystals."]},{"id":"item:war_horn","label":"War Horn","group":"item","sub":"accessory · rare","lines":["Ridged horn shed by a Rime yak, ice still on its tip. Accent: copper.","Picture: Lying across the box: a curved ridged horn shed by a Rime yak, ice crust still on its wide end, a copper mouthpiece at the narrow end and a cord tied round its middle."]},{"id":"place:cinder","label":"Cinder","group":"place","sub":"planet · draft","lines":["Traits: lava world; black basalt plains; rivers of slow lava; steam vents.","Life: Animals with cracked basalt skin and rust-red heat in the cracks; food that is spicy enough to smoke.","Background idea: Black basalt plates split by rust-red lava rivers, steam drawn as wavy ink lines, a dark red sky."]},{"id":"item:magma_newt","label":"Magma Newt","group":"item","sub":"pet, organic · rare","lines":["Basalt-skinned newt with heat cracks and a glass tail. Accent: coral red.","Picture: A newt from a lava planet lying across the box, its skin cracked like cooling black basalt with coral red heat in the cracks as flat colour, its tail ending in a lump of volcanic glass, steam as wavy ink lines."]},{"id":"item:magma_curry","label":"Magma Curry","group":"item","sub":"food, organic · epic","lines":["Curry bubbling like a lava field in a bowl. Accent: coral red.","Picture: Lying across the box: a bowl of curry bubbling like lava, black crust cracking over coral red sauce, a spoon in it."]},{"id":"item:rocket_chili","label":"Rocket Chili","group":"item","sub":"food, organic · rare","lines":["Basalt-skinned lava chili with rocket fins. Accent: coral red.","Picture: A chili from a lava planet: cracked black basalt skin with coral red heat in the cracks as flat colour, stubby rocket fins at the stem."]},{"id":"place:the_drift","label":"The Drift","group":"place","sub":"comet · draft","lines":["Traits: a cloud of icy comets; almost no gravity; trails of frozen dust.","Life: Light, long-legged animals that leap from comet to comet, trailing dust like comet tails.","Background idea: Tumbling comets of dirty ice with long dust tails across a dark sky."]},{"id":"item:comet_fox","label":"Comet Fox","group":"item","sub":"pet, weapon, organic · rare","lines":["Long-legged comet fox mid-leap with a dust-trail tail. Accent: cream.","Picture: A lean fox from a small icy comet, long thin legs for low gravity, mid-leap across the box. Its tail streams behind it as a long trail of frozen dust like a comet tail. Big ears like tiny antenna dishes."]},{"id":"item:comet_sorbet","label":"Comet Sorbet","group":"item","sub":"food · rare","lines":["Scoop of comet ice in a cup, dust tail streaming off it. Accent: teal.","Picture: A scoop of dirty comet ice in a dented ration cup, a long tail of frozen dust streaming off it as if still flying, a spoon on a tether cord."]},{"id":"item:coolant_tank","label":"Coolant Tank","group":"item","sub":"accessory, mechanical · common","lines":["Dented tank with a chunk of comet ice behind a porthole. Accent: teal.","Picture: Upright: a dented steel tank with a round porthole showing a chunk of comet ice inside, a teal frost-rimmed valve on top and a short hose coiled at its foot."]},{"id":"item:lucky_comet","label":"Lucky Comet","group":"item","sub":"accessory · common","lines":["Pebble-sized comet on a knotted string. Accent: cream.","Picture: A tiny comet the size of a pebble on a knotted string, its tail three short flat cream strokes, worn smooth on one side from being rubbed for luck."]},{"id":"item:bone_broth","label":"Comet Broth","group":"item","sub":"food, organic · common","lines":["Mug of broth with a chunk of comet ice melting in it. Accent: copper.","Picture: A copper mug of broth with a sip lid, a chunk of comet ice melting in it, steam drawn as wavy ink lines."]},{"id":"place:ochre","label":"Ochre","group":"place","sub":"planet · draft","lines":["Traits: heavy-gravity desert; layered red sandstone; everything is squat and flat.","Life: Flat, armoured animals with short thick legs; shells and armour of layered sandstone.","Background idea: Low red sandstone mesas in flat layers under a heavy brown sky; nothing stands tall."]},{"id":"item:rock_crab","label":"Rock Crab","group":"item","sub":"pet, armor, organic · common","lines":["Flat crab pressed low by gravity, eyes on long periscope stalks. Accent: copper.","Picture: A squat crab pressed flat by the heavy gravity of Ochre, its shell layered red sandstone, short thick legs, and two eyes on very long periscope stalks to look over the dunes. One thick crystal claw."]},{"id":"item:rock_shell","label":"Rock Shell","group":"item","sub":"armor · common","lines":["Domed shell of layered red sandstone from Ochre. Accent: copper.","Picture: Lying across the box: a low domed shell from the heavy-gravity desert of Ochre, built of flat stacked layers of red sandstone like a squat mesa, two short straps underneath to wear it."]},{"id":"place:thinwind","label":"Thinwind","group":"place","sub":"planet · draft","lines":["Traits: dry desert with very thin air; ore pebbles everywhere; constant dust wind.","Life: Small round burrowers with frilly breathing gills that hoard shiny ore pebbles.","Background idea: Pale dunes full of glinting ore pebbles, burrow holes, a dusty mustard sky."]},{"id":"item:space_hamster","label":"Space Hamster","group":"item","sub":"pet, swarm, weapon, organic · common","lines":["Round hamster with ore-stuffed cheeks and breathing gills. Accent: mustard.","Picture: A round hamster from a thin-air desert planet, cheeks stuffed with shiny ore pebbles, frilly breathing gills on its neck, small room around it. Mustard fur."]},{"id":"item:dust_bunny","label":"Dust Bunny","group":"item","sub":"pet, swarm, organic · common","lines":["Fluffy tumbleweed bunny with a dust devil spinning under it. Accent: cream.","Picture: A round ball of grey fluff from a windy desert planet, rolling like a tumbleweed, two long ears, two dot eyes, a tiny dust devil spinning under it."]},{"id":"item:pebble_mites","label":"Pebble Mites","group":"item","sub":"pet, swarm, weapon, organic · common","lines":["One tiny mite whose shell is a round ore pebble. Accent: mustard.","Picture: One single tiny mite whose shell is a round grey pebble with a mustard ore speck, six thin legs and two long feelers, room around it."]},{"id":"place:gemell","label":"Gemell","group":"place","sub":"planet · draft","lines":["Traits: two moons in its sky; long twilight; pale forests.","Life: Night insects whose markings repeat the two moons.","Background idea: A pale twilight forest under two crescent moons, moths drifting between the trees."]},{"id":"item:moon_moth","label":"Moon Moth","group":"item","sub":"pet, swarm, organic · common","lines":["Pale moth with two crescent moons on each wing. Accent: cream.","Picture: A pale moth from a planet with two moons, each wing marked with two dark crescents, feathery antennae, fuzzy body, wings spread wide."]},{"id":"item:lunar_moth","label":"Lunar Moth","group":"item","sub":"pet, swarm, organic · rare","lines":["Tiny pale moth with moon crescents on its wings, two smaller moths behind it. Accent: cream.","Picture: A tiny pale moth with moon crescents on its wings, two even smaller moths fluttering behind it, dust falling as flat bone specks."]},{"id":"item:glow_beetle","label":"Glow Beetle","group":"item","sub":"pet, swarm, organic · common","lines":["Beetle with a lamp rear and a ringed-planet shell. Accent: mustard.","Picture: A beetle seen from above, its rear end a round lamp drawn as a flat mustard shape, its shell patterned like a tiny planet with one ring."]},{"id":"item:laser_parrot","label":"Laser Parrot","group":"item","sub":"pet, organic · rare","lines":["Parrot with dish-shaped crest feathers firing a laser line. Accent: coral red.","Picture: A parrot from Gemell's twilight forests perched sideways, its crest feathers shaped like small satellite dishes, a straight coral red laser line shooting from its beak."]},{"id":"place:pell","label":"Pell","group":"place","sub":"moon · draft","lines":["Traits: small cratered moon; crumbly pale crust; a ring of drifting crumbs.","Life: Station cooks claim its craters ripen the best moon cheese.","Background idea: A pocked pale moon, close enough to see every crater, with a few crumbs in orbit."]},{"id":"item:moon_cheese","label":"Moon Cheese","group":"item","sub":"food, organic · common","lines":["Cheese wheel shaped like a cratered mini moon with a crumb in orbit. Accent: mustard.","Picture: A small cheese wheel shaped like a cratered mini moon, one wedge cut out showing the pale inside, a single crumb orbiting it like a tiny moon. Mustard rind."]},{"id":"item:healing_spring","label":"Healing Spring","group":"item","sub":"accessory · epic","lines":["Moon-rock basin, water rising as floating balls in low gravity. Accent: teal.","Picture: Filling the square box: a small basin of pale moon rock, water rising from its middle as floating teal balls in low gravity, sage moss on the rim."]},{"id":"place:scrap_belt","label":"The Scrap Belt","group":"place","sub":"belt · draft","lines":["Traits: asteroid belt full of wrecks; mining claims; drifting ship parts.","Life: Miners, salvage robots and burrowing animals that live inside asteroids.","Background idea: Asteroids and broken hulls tumbling together, a mining tether between two rocks."]},{"id":"hero:rook","label":"RK-7 \"Rook\"","group":"hero","sub":"Salvage Unit","lines":[]},{"id":"item:mining_pick","label":"Mining Pick","group":"item","sub":"weapon · common","lines":["L-shaped meteor-iron pick with a crystal tip and a small thruster. Accent: teal.","Picture: The pick head runs along the top two cells, the handle drops down the left cell; the empty corner stays free. Meteor-iron head with a teal crystal tip and a small thruster on its back, taped grip, tether clip."]},{"id":"item:asteroid_chunk","label":"Asteroid Chunk","group":"item","sub":"weapon · common","lines":["A throwable little asteroid with its own pebble moon and a strap. Accent: copper.","Picture: Lying across the box: a lumpy grey-brown little asteroid with a carry strap bolted on so it can be thrown, a tiny pebble moon orbiting it on a dashed line."]},{"id":"item:asteroid_mole","label":"Asteroid Mole","group":"item","sub":"pet, organic · common","lines":["Mole with diamond claws and a tiny tail jet for drifting. Accent: copper.","Picture: Upright: a stubby mole standing on its hind legs, huge diamond-tipped digging claws, an asteroid crumb on its nose, its tail ending in a tiny jet for drifting between rocks."]},{"id":"item:scrap_metal","label":"Scrap Metal","group":"item","sub":"accessory, mechanical · common","lines":["Bent hull plate with rivets and half a painted star. Accent: copper.","Picture: A bent square of hull plate with three rivets, one torn edge and half of a painted star, copper patina in the corners."]},{"id":"item:plasma_cutter","label":"Plasma Cutter","group":"item","sub":"weapon, mechanical · common","lines":["Wreck-salvage cutter with a short plasma blade and a magnet clamp. Accent: coral red.","Picture: Lying across the box: a wreck-salvage cutter built from a welding torch and a ship's fuel valve, a short flat coral red blade of plasma at the nozzle, a magnet clamp on the housing so it sticks to hulls in zero gravity."]},{"id":"item:hull_plating","label":"Hull Plating","group":"item","sub":"armor, mechanical · common","lines":["Curved hull slab with a porthole and a welded patch. Accent: copper.","Picture: Lying across the box: a curved slab of ship hull with rivets along its edges, a small round porthole in the middle with one star behind the glass, a copper patch welded over a dent."]},{"id":"place:garden_station","label":"The Garden Station","group":"place","sub":"station · draft","lines":["Traits: research station that bred crops for open vacuum; overgrown by the failed experiment.","Life: Venn and everything that grew from it; the botanist's old drone.","Background idea: A station ring split open, rust-red tendrils growing out of the windows into space."]},{"id":"hero:venn","label":"Venn","group":"hero","sub":"The Thing in the Suit","lines":[]},{"id":"item:seed_pod","label":"Seed Pod","group":"item","sub":"weapon, organic · common · Venn","lines":["Hard seed pod with a split seam spitting seeds, a paper specimen tag tied to its stem. Accent: sage.","Picture: A hard seed pod split along one seam, spitting small seeds, a paper specimen tag from Venn's lab tied to its stem."]},{"id":"item:watering_drone","label":"Watering Drone","group":"item","sub":"pet, mechanical · common · Venn","lines":["Small dented drone with a watering-can spout and a faded stencil patch, a vine wound round one leg. Accent: teal.","Picture: Venn's botanist's old drone, still following the suit: round, dented, spout forward, one vine wound round its single leg. The stencil is a faded patch, no letters."]},{"id":"place:herdworld","label":"Herdworld","group":"place","sub":"planet · draft","lines":["Traits: wide grass plains; wild herds of space beasts; where Quill's escape pod came down.","Life: Huge shaggy tusked beasts and the smaller animals that ride in their fur.","Background idea: Rolling plains with a dented escape pod half sunk in the grass and a herd on the horizon."]},{"id":"hero:quill","label":"Quill","group":"hero","sub":"Foundling of the Herd","lines":[]},{"id":"item:tusked_behemoth","label":"Tusked Behemoth","group":"item","sub":"pet, beast, weapon, organic · epic · Quill","lines":["Huge shaggy beast with four tusks, low and heavy, a small woven nest between its horns. Accent: copper.","Picture: Quill's mount, the same beast as in the hero design. A huge, low, shaggy body filling the box sideways, head to one side with four curved tusks under a heavy brow and tiny eyes. Between its horns an empty woven nest (Quill herself is not in the picture). Matted fur in heavy clumps, two small animals clinging to its flank."]},{"id":"item:dune_ox","label":"Dune Ox","group":"item","sub":"pet, beast, weapon, organic · common","lines":["Shaggy ox with a mossy saddle back where small animals ride. Accent: copper.","Picture: Filling the square box: a big shaggy ox of the Herdworld plains, head lowered, wide curved horns, puffed air sacs at its throat, its broad back a flat saddle of moss where a tiny animal rides. One hoof scraping the ground."]},{"id":"place:corona","label":"The Dying Corona","group":"place","sub":"star · draft","lines":["Traits: a red star close to its end; Ysel's order keeps it company; breaking into fragments; the planet Vigil circles it.","Life: Pilgrims of the order; cracked sun pieces carried as relics.","Background idea: A huge cracked red-and-mustard star filling the sky, broken pieces circling it, heat as wavy ink lines."]},{"id":"item:sun_shard","label":"Sun Shard","group":"item","sub":"weapon · common · Ysel","lines":["Broken piece of a dying sun, cracked flat mustard and rust, wavy heat lines. Accent: mustard.","Picture: A broken piece of a dying sun, cracked flat mustard and rust, wavy heat lines rising, no glow."]},{"id":"place:vigil","label":"Vigil","group":"place","sub":"planet · draft","lines":["Traits: red desert planet close to the Dying Corona; the dying star hangs huge and low in its sky; ruins of the solar moths' monastery.","Life: Solar moths of Ysel's order, who fly to dying stars and stay until the end; dry grass on red sand.","Background idea: Red sandy desert with mesas under a coral and mustard evening sky, the huge cracked red star low on the horizon, old stone pillars carved with sun and moon phases."]},{"id":"hero:ysel","label":"Ysel","group":"hero","sub":"Moth of the Last Light","lines":[]},{"id":"place:murk","label":"Murk","group":"place","sub":"planet · draft","lines":["Traits: swamp planet under thick fog; giant fungi and thorn vines; toxic spore rain.","Life: Slow swamp creatures with venom sacs, puffball fungi big as houses, black thorn vines.","Background idea: Sage-green fog over black water, giant puffball mushrooms and thorn vines, a dim sun as a pale disc."]},{"id":"item:spore_launcher","label":"Spore Launcher","group":"item","sub":"weapon, organic · rare","lines":["Living tube gun grown from a Murk puffball, spore pods inside. Accent: sage.","Picture: Lying across the box: a tube gun grown from a giant puffball fungus of the fog planet Murk, its breech a hinged mushroom cap, round sage spore pods inside, one pod at the muzzle."]},{"id":"item:acid_flask","label":"Acid Flask","group":"item","sub":"weapon, organic · rare","lines":["Flask with a pressure valve, acid floating as a ball inside. Accent: sage.","Picture: A round flask with a pressure valve instead of a stopper, sage acid inside floating as a ball in zero gravity, one drop eating a hole in the glass."]},{"id":"item:thorn_mail","label":"Thorn Mail","group":"item","sub":"armor, organic · rare","lines":["Vest woven from Murk's black thorn vines. Accent: sage.","Picture: Lying across the box: a vest woven from the thick black thorn vines of the fog planet Murk, hooked thorns at every crossing, a few sage leaves curled into small spirals."]},{"id":"item:venom_sac","label":"Venom Sac","group":"item","sub":"accessory, organic · common","lines":["Venom sac of a Murk swamp creature, sealed with a valve clip. Accent: sage.","Picture: A swollen sage venom sac from a swamp creature of Murk, dark veins, its neck sealed with a little valve clip, one drop hanging from the tip."]},{"id":"item:mushroom_cluster","label":"Mushroom Cluster","group":"item","sub":"food, organic · common","lines":["Three Murk mushrooms with dish-shaped caps all turned one way. Accent: sage.","Picture: Three small mushrooms from the fog planet Murk growing from one clump, their sage caps shaped like little satellite dishes, all turned the same way."]},{"id":"place:facet","label":"Facet","group":"place","sub":"planet · draft","lines":["Traits: crystal planet; forests of teal crystal spikes; light split into bands everywhere.","Life: Beasts with crystal teeth and claws; miners who cut needles and candy-shaped shards.","Background idea: Teal crystal spires rising from a pale plain, broken light bands drawn as flat stripes across the sky."]},{"id":"item:fang_dagger","label":"Fang Dagger","group":"item","sub":"weapon, organic · common","lines":["A crystal-tipped fang lashed to a short hilt. Accent: cream.","Picture: A single curved cream fang of a crystal-toothed beast from Facet, its tip a teal crystal, lashed to a short wrapped hilt with a tether clip at the end."]},{"id":"item:needle_rifle","label":"Needle Rifle","group":"item","sub":"weapon, mechanical · rare","lines":["Long thin rifle with a drum of crystal needles from Facet. Accent: teal.","Picture: Along the long box: a thin long-barrelled rifle with a slim stock and a long scope, under the middle a see-through drum full of teal crystal needles from the planet Facet, one needle flying from the muzzle as a straight black stroke."]},{"id":"item:crystal_shard","label":"Crystal Shard","group":"item","sub":"accessory · common","lines":["Jagged crystal spike from Facet with splinters orbiting it. Accent: teal.","Picture: A jagged teal crystal spike from the crystal planet Facet, hard flat facets, two tiny crystal splinters orbiting it."]},{"id":"item:crystal_candy","label":"Crystal Candy","group":"item","sub":"food · rare","lines":["Hard candy shaped like a Facet crystal on a stick. Accent: teal.","Picture: A hard candy shaped like a teal crystal from the planet Facet, on a stick, a small bite missing from one facet."]},{"id":"place:the_veil","label":"The Veil","group":"place","sub":"nebula · draft","lines":["Traits: a nebula of slow drifting clouds; no ground at all; creatures that swim through gas.","Life: Jellies, whales and squids that swim between the clouds; their calves are born in the dense middle.","Background idea: Soft layered nebula clouds in teal and coral against the navy sky, a whale shape far away."]},{"id":"item:tentacle_whip","label":"Tentacle Whip","group":"item","sub":"weapon, organic · rare","lines":["Whip of a nebula squid tentacle, tip curled like a galaxy. Accent: cream.","Picture: Along the long box: a wrapped hilt at one end, from it a long tapering tentacle of a squid from the Veil nebula in loose curves, a row of cream suckers, its tip curled into a spiral like a small galaxy."]},{"id":"item:phase_cloak","label":"Phase Cloak","group":"item","sub":"armor · epic","lines":["Hooded cloak cut from a nebula, fading into dashes below. Accent: cream.","Picture: Upright: a hooded cloak cut from the Veil nebula, the top half solid dark cloth sprinkled with a few cream stars, the lower half breaking up into rows of dashes as if it is not fully there."]},{"id":"item:nebula_jelly","label":"Nebula Jelly","group":"item","sub":"pet, organic · rare","lines":["Jellyfish with a nebula cloud inside its bell. Accent: teal.","Picture: Lying across the box: a jellyfish drifting through the Veil nebula, its bell a see-through dome with a small teal swirl of nebula cloud inside, tentacles trailing behind like dust trails."]},{"id":"item:star_whale_calf","label":"Star Whale Calf","group":"item","sub":"pet, beast, organic · epic","lines":["Chubby baby whale with star freckles swimming through space. Accent: teal.","Picture: Filling the wide box: a chubby baby whale swimming sideways through space, its back speckled with small stars like freckles, a big curious eye and a short spout of mist. Underbelly in pale bone with grooves, the back teal."]},{"id":"item:void_kraken","label":"Void Kraken","group":"item","sub":"pet, beast, weapon, organic · legendary","lines":["Dark tentacle const W=900,H=700,R={place:16,hero:12,item:8};
const N=D.nodes.map((n,i)=>({...n,x:W/2+Math.cos(i*2.4)*(60+i*6),y:H/2+Math.sin(i*2.4)*(60+i*6),vx:0,vy:0}));
const byId=Object.fromEntries(N.map(n=>[n.id,n]));const L=D.links.map(([a,b,t])=>({a:byId[a],b:byId[b],t}));
function step(k){for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){const a=N[i],b=N[j];let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy||1;const f=Math.min(2200/d2,4)*k,d=Math.sqrt(d2);dx/=d;dy/=d;a.vx+=dx*f;a.vy+=dy*f;b.vx-=dx*f;b.vy-=dy*f}
for(const l of L){const dx=l.b.x-l.a.x,dy=l.b.y-l.a.y,d=Math.hypot(dx,dy)||1,want=l.t==="orbits"?70:l.a.group==="place"&&l.b.group==="hero"?80:60,f=(d-want)*0.03*k;l.a.vx+=dx/d*f;l.a.vy+=dy/d*f;l.b.vx-=dx/d*f;l.b.vy-=dy/d*f}
for(const n of N){n.vx+=(W/2-n.x)*0.002*k;n.vy+=(H/2-n.y)*0.002*k;if(n.fixed){n.vx=n.vy=0;continue}n.x+=n.vx;n.y+=n.vy;n.vx*=0.6;n.vy*=0.6;n.x=Math.max(30,Math.min(W-130,n.x));n.y=Math.max(20,Math.min(H-20,n.y))}}
for(let i=0;i<500;i++)step(1);
const svg=document.getElementById("g"),NS="http://www.w3.org/2000/svg";
const el=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e};
const lines=L.map(l=>{const e=el("line",{});svg.appendChild(e);return e});
const col={place:"var(--place)",hero:"var(--hero)",item:"var(--item)"};
const gs=N.map(n=>{const g=el("g",{class:"n"});g.appendChild(el("circle",{r:R[n.group],fill:col[n.group],stroke:"#0b0d14","stroke-width":2}));const t=el("text",{x:R[n.group]+4,y:4});t.textContent=n.label;g.appendChild(t);svg.appendChild(g);return g});
function draw(){L.forEach((l,i)=>{lines[i].setAttribute("x1",l.a.x);lines[i].setAttribute("y1",l.a.y);lines[i].setAttribute("x2",l.b.x);lines[i].setAttribute("y2",l.b.y)});N.forEach((n,i)=>gs[i].setAttribute("transform","translate("+n.x+","+n.y+")"))}
draw();
const info=document.getElementById("info");
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"})[c])}
function select(n){const nb=new Set([n.id]);L.forEach((l,i)=>{const on=l.a===n||l.b===n;lines[i].classList.toggle("hl",on);if(on){nb.add(l.a.id);nb.add(l.b.id)}});
N.forEach((m,i)=>gs[i].classList.toggle("dim",!nb.has(m.id)));
const rel=L.filter(l=>l.a===n||l.b===n).map(l=>{const o=l.a===n?l.b:l.a;return '<li data-id="'+o.id+'">'+esc(o.label)+' <span style="color:var(--muted)">('+esc(l.a===n?l.t:{"origin of":"comes from","home of":"lives at","orbits":"orbited by","hero item":"item of"}[l.t])+')</span></li>'}).join("");
info.innerHTML="<h2>"+esc(n.label)+'</h2><div class="sub">'+esc(n.group+" · "+n.sub)+"</div>"+n.lines.map(s=>"<p>"+esc(s)+"</p>").join("")+(rel?"<ul>"+rel+"</ul>":"");
info.querySelectorAll("li").forEach(li=>li.onclick=()=>select(byId[li.dataset.id]))}
let drag=null,moved=false,start=null;
function pt(e){const r=svg.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
gs.forEach((g,i)=>g.addEventListener("pointerdown",e=>{drag=N[i];moved=false;start=pt(e);drag.fixed=true;g.setPointerCapture(e.pointerId)}));
svg.addEventListener("pointermove",e=>{if(!drag)return;const p=pt(e);if(!moved&&Math.hypot(p.x-start.x,p.y-start.y)<6)return;drag.x=p.x;drag.y=p.y;moved=true;for(let i=0;i<3;i++)step(0.3);draw()});
const up=()=>{if(drag&&!moved)select(drag);if(drag)drag.fixed=false;drag=null};gs.forEach(g=>g.addEventListener("pointerup",up));svg.addEventListener("pointerup",up);
